image: node:22
pipelines:
  default:
    - step:
        name: Lint, test, build, audit and secret scan
        caches: [node]
        script:
          - npm ci --ignore-scripts
          - npm run lint
          - npm test -- --ci
          - npm run build
          - npm audit --audit-level=high
          - '! git grep -nE "(mongodb\+srv|BEGIN (RSA|OPENSSH|EC|PGP) PRIVATE KEY|sk-[A-Za-z0-9]{20,})" -- '*.ts' '*.js' '*.json' '*.yml' '*.yaml' '*.md'
