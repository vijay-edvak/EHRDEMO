services:
  backend:
    build: ./ehr-admin-backend
    env_file: ./ehr-admin-backend/.env
    ports: ["3000:3000"]
    healthcheck: { test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"], interval: 30s, timeout: 5s, retries: 3 }
  frontend:
    build: ./ehr-admin-frontend
    ports: ["8080:80"]
    depends_on: { backend: { condition: service_healthy } }
