apiVersion: apps/v1
kind: Deployment
metadata: { name: ehr-admin-backend }
spec:
  replicas: 2
  selector: { matchLabels: { app: ehr-admin-backend } }
  template:
    metadata: { labels: { app: ehr-admin-backend } }
    spec:
      containers:
        - name: backend
          image: ehr-admin-backend:latest
          ports: [{containerPort: 3000}]
          envFrom: [{secretRef: {name: ehr-admin-secrets}}]
          readinessProbe: {httpGet: {path: /api/health, port: 3000}, initialDelaySeconds: 10}
          livenessProbe: {httpGet: {path: /api/health, port: 3000}, initialDelaySeconds: 20}
---
apiVersion: v1
kind: Service
metadata: { name: ehr-admin-backend }
spec:
  selector: { app: ehr-admin-backend }
  ports: [{port: 3000, targetPort: 3000}]
